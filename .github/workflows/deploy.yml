name: Deploy

# Push to main  -> demo deploys automatically, then production waits for a
#                  required reviewer on the "production" environment.
# Manual run    -> pick demo, production, or both (Actions tab -> Deploy -> Run workflow).

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: Which stack to deploy
        required: true
        default: demo
        type: choice
        options: [demo, production, both]

# Only main is ever deployed; a manual run started from another branch does nothing.
permissions:
  contents: read

jobs:
  deploy-demo:
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.target == 'demo' || inputs.target == 'both')
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-docker-stack.yml
    with:
      environment: demo
    secrets: inherit

  deploy-production:
    needs: deploy-demo
    # Runs after a successful demo deploy, or alone when "production" is chosen manually.
    if: >-
      always() && github.ref == 'refs/heads/main' && (
        (needs.deploy-demo.result == 'success' && (github.event_name == 'push' || inputs.target == 'both'))
        || (needs.deploy-demo.result == 'skipped' && inputs.target == 'production')
      )
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-docker-stack.yml
    with:
      environment: production
    secrets: inherit
