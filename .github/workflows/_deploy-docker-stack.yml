name: Deploy docker stack (reusable)

# Deploys one DOCiD docker compose stack over SSH. Called by deploy.yml once
# per GitHub environment ("demo", "production"). Each environment holds its own:
#   secrets: SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT, SSH_FINGERPRINT
#   vars:    STACK_DIR  (e.g. /opt/docid.africapidalliance.org)
#
# State kept on the server in ~/.docid-deploy/<stack>/:
#   deployed_sha  - commit the running containers were built from (written only on success)
#   previous_sha  - commit running before the current deploy started
#   rollback_tag  - tag of the preserved pre-deploy images (docid-rollback/<service>:<tag>)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 70
    env:
      DEPLOY_SHA: ${{ github.sha }}
      STACK_DIR: ${{ vars.STACK_DIR }}
      # Follows the repo this workflow runs in, so moving it to another org/account needs no edit.
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      # Long step, zero downtime: the running containers keep serving while the
      # new images build. Split from the restart so a slow build can never leave
      # a half-applied migration behind.
      - name: Fetch code and build images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 50m
          script_stop: true
          envs: DEPLOY_SHA,STACK_DIR,REPO_URL
          script: |
            set -eu
            test -n "$STACK_DIR" || { echo "STACK_DIR is not set for this environment" >&2; exit 1; }
            cd "$STACK_DIR"
            deploy_state_dir="$HOME/.docid-deploy/$(basename "$STACK_DIR")"
            mkdir -p "$deploy_state_dir"

            # Trust the recorded running revision over the checkout: a failed
            # earlier build could have left the checkout ahead of the containers.
            if [ -s "$deploy_state_dir/deployed_sha" ]; then
              previous_sha=$(cat "$deploy_state_dir/deployed_sha")
            else
              previous_sha=$(git rev-parse HEAD)
            fi
            echo "Currently deployed: $previous_sha"
            echo "Deploying:          $DEPLOY_SHA"

            # Public repo: fetch over HTTPS so the server needs no GitHub key.
            git fetch --no-tags "$REPO_URL" +refs/heads/main:refs/remotes/origin/main
            git cat-file -e "$DEPLOY_SHA^{commit}"

            # Preserve the running images BEFORE building: once `compose build`
            # moves :latest, the old image can no longer be tagged.
            rollback_tag="$(date +%Y%m%d%H%M%S)-$(echo "$previous_sha" | cut -c1-7)"
            for service_name in backend frontend; do
              container_id=$(docker compose ps -q "$service_name")
              if [ -n "$container_id" ]; then
                running_image_id=$(docker inspect --format '{{.Image}}' "$container_id")
                docker image tag "$running_image_id" "docid-rollback/$service_name:$rollback_tag"
                echo "Tagged running $service_name image as docid-rollback/$service_name:$rollback_tag"
              fi
            done
            echo "$previous_sha" > "$deploy_state_dir/previous_sha"
            echo "$rollback_tag" > "$deploy_state_dir/rollback_tag"

            # If the build fails, put the checkout back so it matches what runs.
            trap 'echo "Build failed - restoring checkout to $previous_sha" >&2; git reset --hard "$previous_sha"' EXIT
            git reset --hard "$DEPLOY_SHA"
            docker compose build backend frontend
            trap - EXIT

            # Keep only the 3 newest rollback images per service.
            for service_name in backend frontend; do
              docker images "docid-rollback/$service_name" --format '{{.Tag}}' \
                | sort -r | tail -n +4 \
                | xargs -r -I{} docker rmi "docid-rollback/$service_name:{}" || true
            done

      - name: Migrate, restart and health-check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 10m
          script_stop: true
          envs: DEPLOY_SHA,STACK_DIR
          script: |
            set -eu
            cd "$STACK_DIR"
            deploy_state_dir="$HOME/.docid-deploy/$(basename "$STACK_DIR")"
            previous_sha=$(cat "$deploy_state_dir/previous_sha")
            rollback_tag=$(cat "$deploy_state_dir/rollback_tag")

            roll_back_app_containers() {
              echo "ERROR: $1 - rolling back app containers to $previous_sha" >&2
              docker compose logs --tail 80 backend frontend >&2 || true
              for service_name in backend frontend; do
                if docker image inspect "docid-rollback/$service_name:$rollback_tag" > /dev/null 2>&1; then
                  compose_image_name="$(basename "$STACK_DIR" | tr -d '.')-$service_name"
                  docker image tag "docid-rollback/$service_name:$rollback_tag" "$compose_image_name"
                fi
              done
              git reset --hard "$previous_sha"
              docker compose up -d --no-deps --force-recreate backend frontend || true
              echo "Rolled back app containers. Database migrations (if any ran) were NOT reverted." >&2
              exit 1
            }

            wait_until_healthy() {
              backend_host_port=$(docker compose port backend 5001 | head -1 | sed 's/.*://')
              frontend_host_port=$(docker compose port frontend 3000 | head -1 | sed 's/.*://')
              for attempt_number in $(seq 1 36); do
                # get-publications touches the database, so it proves more than "gunicorn is up".
                if curl -sf "http://127.0.0.1:$backend_host_port/api/v1/publications/get-publications?page=1&page_size=1" > /dev/null \
                  && curl -sf "http://127.0.0.1:$frontend_host_port/" > /dev/null; then
                  return 0
                fi
                echo "Waiting for services ($attempt_number/36)..."
                sleep 5
              done
              return 1
            }

            echo "=== Running database migrations ==="
            # Old containers are still serving here; on failure only the checkout needs restoring.
            if ! docker compose run --rm --no-deps backend flask db upgrade; then
              git reset --hard "$previous_sha"
              echo "ERROR: migration failed - old containers left running, checkout restored" >&2
              exit 1
            fi

            echo "=== Recreating backend and frontend ==="
            docker compose up -d --no-deps --force-recreate backend frontend \
              || roll_back_app_containers "container recreate failed"

            wait_until_healthy || roll_back_app_containers "health check failed"

            echo "$DEPLOY_SHA" > "$deploy_state_dir/deployed_sha"
            echo "Deploy healthy at $DEPLOY_SHA"
            docker compose ps backend frontend
